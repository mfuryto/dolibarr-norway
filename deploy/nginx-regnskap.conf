# HTTP bootstrap. Certbot --nginx adds TLS and redirects HTTP to HTTPS.
# Do not start the backend or log in through the domain before TLS is configured.
server {
    listen 80;
    listen [::]:80;
    server_name regnskap.thunold-olsen.no;
    client_max_body_size 24m;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /install/ { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
